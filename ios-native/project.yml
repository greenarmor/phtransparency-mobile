name: BetterGovBudget
options:
  bundleIdPrefix: ph.bettergov
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BetterGovBudget:
    type: application
    platform: iOS
    sources: [BetterGovBudget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ph.bettergov.budget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "BetterGov Budget"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
  BetterGovBudgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BetterGovBudgetUITests]
    dependencies:
      - target: BetterGovBudget
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ph.bettergov.budget.uitests
schemes:
  BetterGovBudget:
    build:
      targets:
        BetterGovBudget: all
    test:
      targets: [BetterGovBudgetUITests]
